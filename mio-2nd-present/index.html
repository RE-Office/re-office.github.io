<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>🎄 プレゼント候補 🎁</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>🎄 プレゼント候補🎁</h1>

検索：<input id="searchBox" placeholder="キーワード検索">

<div class="controls">
  <button id="saveBtn">確定（保存）</button>
  <button id="cancelBtn">キャンセル</button>
</div>

<table id="giftTable">
  <thead>
    <tr>
      <th data-key="type">種別</th>
      <th data-key="maker">メーカー</th>
      <th data-key="name">商品名</th>
      <th data-key="price">価格帯</th>
      <th data-key="url">URL</th>
      <th>編集</th>
      <th>削除</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div id="countdownBox" class="countdown-box"></div>

<div class="add-box">
  <h3 style="margin:0 0 10px 0;">🎁 追加</h3>
  種別: <input id="addType">
  メーカー: <input id="addMaker">
  商品名: <input id="addName">
  価格: <input id="addPrice">
  URL: <input id="addUrl" size="40">
  <button id="addBtn">追加</button>
</div>

<div id="toast" class="toast"></div>

<!-- 🔥 ローディングオーバーレイは script より前に置く -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loader">読み込み中…</div>
</div>

<script src="js/toast.js"></script>
<script src="js/snow.js"></script>
<script src="js/edit.js"></script>
<script src="js/app.js"></script>

</body>
</html>
