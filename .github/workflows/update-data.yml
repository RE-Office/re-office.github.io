name: Update data.json

on:
  repository_dispatch:
    types: [update_data]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Debug payload
        run: |
          echo "Received JSON payload:"
          echo '${{ github.event.client_payload.json }}'

      - name: Update data.json
        run: |
          echo '${{ github.event.client_payload.json }}' > data.json

      - name: Commit and push
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Update data.json" || echo "No changes to commit"
          git push https://x-access-token:${TOKEN}@github.com/<USER>/<REPO>.git
