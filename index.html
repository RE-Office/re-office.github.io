<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>🎄 プレゼント候補一覧 🎁</title>

<style>
  body {
    font-family: "Segoe UI", "Hiragino Sans", sans-serif;
    background: linear-gradient(135deg, #ffefef, #fff8e6);
    padding: 30px;
    color: #333;
  }

  h1 {
    text-align: center;
    margin-bottom: 25px;
    font-weight: 700;
    font-size: 32px;
    color: #b30000;
    text-shadow: 0 0 8px rgba(255, 200, 200, 0.8);
  }

  #searchBox {
    width: 260px;
    padding: 10px 14px;
    border: 2px solid #c62828;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 15px;
    background: #fff;
    box-shadow: 0 0 8px rgba(255, 0, 0, 0.15);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
  }

  th {
    background: linear-gradient(90deg, #c62828, #8e0000);
    color: #fff;
    padding: 14px;
    cursor: pointer;
    font-weight: 600;
    border-bottom: 2px solid #b71c1c;
    letter-spacing: 0.5px;
  }

  th:hover {
    background: linear-gradient(90deg, #d84315, #ad0000);
  }

  td {
    padding: 14px;
    border-bottom: 1px solid #eee;
  }

  tr:nth-child(even) {
    background: #fffdf7;
  }

  tr:hover {
    background: #fff3e0;
  }

  a {
    color: #00695c;
    font-weight: 600;
  }

  a:hover {
    text-decoration: underline;
    color: #004d40;
  }

  /* クリスマスの小さな装飾 */
  .snow {
    position: fixed;
    top: -10px;
    left: 0;
    width: 100%;
    height: 10px;
    pointer-events: none;
    background-image: radial-gradient(white 2px, transparent 2px);
    background-size: 20px 20px;
    animation: snow 10s linear infinite;
    opacity: 0.6;
  }

  @keyframes snow {
    from { transform: translateY(0); }
    to { transform: translateY(100vh); }
  }
</style>
</head>

<body>

<div class="snow"></div>

<h1>🎄 プレゼント候補一覧 🎁</h1>

検索：<input id="searchBox" placeholder="キーワード検索">

<table id="giftTable">
  <thead>
    <tr>
      <th data-key="type">種別</th>
      <th data-key="maker">メーカー</th>
      <th data-key="name">商品名</th>
      <th data-key="price">価格帯</th>
      <th data-key="url">メモ</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const API = "https://script.google.com/macros/s/AKfycbzkJHQo-2Qih294C1xR8ROpnO_ouRCn9Rv5gN2kIf5kz5JAESccp7JbsFiNLzagXXfG-w/exec";

let originalData = [];
let filteredData = [];
let sortState = {};

function renderTable(data) {
  const tbody = document.querySelector("#giftTable tbody");
  tbody.innerHTML = "";

  data.forEach(item => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${item.type}</td>
      <td>${item.maker}</td>
      <td>${item.name}</td>
      <td>${item.price}</td>
      <td><a href="${item.url}" target="_blank">商品ページ</a></td>
    `;
    tbody.appendChild(tr);
  });
}

function sortData(key) {
  if (sortState.key === key) {
    sortState.order = sortState.order === "asc" ? "desc" : "asc";
  } else {
    sortState.key = key;
    sortState.order = "asc";
  }

  filteredData.sort((a, b) => {
    let x = a[key];
    let y = b[key];

    if (key === "price") {
      x = parseInt(x.replace(/[^0-9]/g, "")) || 0;
      y = parseInt(y.replace(/[^0-9]/g, "")) || 0;
    }

    if (x < y) return sortState.order === "asc" ? -1 : 1;
    if (x > y) return sortState.order === "asc" ? 1 : -1;
    return 0;
  });

  renderTable(filteredData);
}

function filterData(keyword) {
  keyword = keyword.toLowerCase();

  filteredData = originalData.filter(item =>
    item.type.toLowerCase().includes(keyword) ||
    item.maker.toLowerCase().includes(keyword) ||
    item.name.toLowerCase().includes(keyword) ||
    item.price.toLowerCase().includes(keyword) ||
    item.url.toLowerCase().includes(keyword)
  );

  if (sortState.key) {
    sortData(sortState.key);
  } else {
    renderTable(filteredData);
  }
}

(async () => {
  const res = await fetch(API + "?t=" + Date.now(), { cache: "no-store" });
  const data = await res.json();

  originalData = data;
  filteredData = data;

  renderTable(data);
})();

document.getElementById("searchBox").addEventListener("input", e => {
  filterData(e.target.value);
});

document.querySelectorAll("#giftTable th").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    sortData(key);
  });
});
</script>

</body>
</html>
