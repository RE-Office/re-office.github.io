<script>
const API = "https://script.google.com/macros/s/AKfycbzkJHQo-2Qih294C1xR8ROpnO_ouRCn9Rv5gN2kIf5kz5JAESccp7JbsFiNLzagXXfG-w/exec";

fetch(API + "?t=" + Date.now())
  .then(res => res.json())
  .then(data => {
    const tbody = document.querySelector("#giftTable tbody");
    data.forEach(item => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${item.type}</td>
        <td>${item.maker}</td>
        <td>${item.name}</td>
        <td>${item.price}</td>
        <td><a href="${item.url}" target="_blank">商品ページv1</a></td>
      `;
      tbody.appendChild(tr);
    });
  });
</script>
