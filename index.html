<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プレゼント候補一覧</title>

<style>
  table { width: 100%; border-collapse: collapse; }
  table, th, td { border: 1px solid #333; }
  th, td { padding: 8px; }
  th { background: #f2f2f2; }
</style>
</head>

<body>

<h1>プレゼント候補一覧</h1>

<table id="giftTable">
  <thead>
    <tr>
      <th>種別</th>
      <th>メーカー</th>
      <th>商品名</th>
      <th>価格帯</th>
      <th>メモ</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const API = "https://script.google.com/macros/s/XXXXX/exec";

(async () => {
  try {
    const res = await fetch(API + "?t=" + Date.now(), { cache: "no-store" });
    const text = await res.text();

    try {
      const data = JSON.parse(text);

      const tbody = document.querySelector("#giftTable tbody");
      data.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.type}</td>
          <td>${item.maker}</td>
          <td>${item.name}</td>
          <td>${item.price}</td>
          <td><a href="${item.url}" target="_blank">商品ページ</a></td>
        `;
        tbody.appendChild(tr);
      });

    } catch (jsonErr) {
      document.body.innerHTML =
        "<pre style='white-space:pre-wrap;background:#fee;padding:10px;'>JSON parse error:\n" +
        jsonErr + "\n\nResponse text:\n" + text + "</pre>";
    }

  } catch (err) {
    document.body.innerHTML =
      "<pre style='white-space:pre-wrap;background:#fee;padding:10px;'>Fetch error:\n" +
      err + "</pre>";
  }
})();
</script>

</body>
</html>
