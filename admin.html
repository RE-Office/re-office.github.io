<script>
document.getElementById("updateForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const newJson = document.getElementById("jsonInput").value;

  try {
    const res = await fetch(
      "https://api.github.com/repos/<USER>/<REPO>/dispatches",
      {
        method: "POST",
        headers: {
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          event_type: "update_data",
          client_payload: { json: newJson }
        })
      }
    );

    const text = await res.text();  // ← レスポンスの中身を全部読む

    document.getElementById("status").innerText =
      `status: ${res.status}\n\nresponse:\n${text}`;

    console.log("status:", res.status);
    console.log("response:", text);

  } catch (err) {
    document.getElementById("status").innerText = `fetch error: ${err}`;
    console.error("fetch error:", err);
  }
});
</script>
